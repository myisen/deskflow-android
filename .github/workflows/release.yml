name: Release

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Tag to release'
        required: false
        default: 'v1.0.0'
        type: string

  workflow_call:
    inputs:
      tagName:
        description: 'Tag to release'
        required: true
        type: string

  push:
    tags:
      - 'v**'

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    environment: DeskflowAndroid
    steps:
      - name: Get tag from input
        if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        run: |
          echo "tag_name=${{ inputs.tagName }}" >> $GITHUB_ENV

      - name: Get tag from push
        if: github.event_name == 'push'
        run: |
          echo "tag_name=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.tag_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build release AAB
        run: ./gradlew clean bundleRelease

      - name: Sign AAB (if secrets configured)
        id: sign_aab
        if: ${{ format('{0}', secrets.SIGNING_KEY) != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle-ready/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare release files (AAB)
        run: |
          if [ -n "${{ steps.sign_aab.outputs.signedReleaseFile }}" ]; then
            echo "release_file=${{ steps.sign_aab.outputs.signedReleaseFile }}" >> $GITHUB_ENV
          else
            UNSIGNED=$(find app/build/outputs/bundle-ready/release -name "*.aab" | head -1)
            cp "$UNSIGNED" app/build/outputs/bundle-ready/release/DeskflowAndroid-${{ env.tag_name }}-unsigned.aab
            echo "release_file=$(readlink -f app/build/outputs/bundle-ready/release/DeskflowAndroid-${{ env.tag_name }}-unsigned.aab)" >> $GITHUB_ENV
          fi

      - name: Create/Update GitHub Release (AAB)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.release_file }}
          tag_name: ${{ env.tag_name }}
          body: |
            ## Deskflow Android ${{ env.tag_name }}

            首次正式发布，支持 Android 14+ (API 34)。

            ### 特性
            - ARM-only 构建（armeabi-v7a, arm64-v8a）
            - 客户端-服务端 Deskflow 协议实现
            - 虚拟键盘 (IME) 与辅助功能服务
            - 剪贴板同步（文本）
            - TLS 支持
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-apk:
    runs-on: ubuntu-latest
    environment: DeskflowAndroid
    steps:
      - name: Get tag from input
        if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        run: |
          echo "tag_name=${{ inputs.tagName }}" >> $GITHUB_ENV

      - name: Get tag from push
        if: github.event_name == 'push'
        run: |
          echo "tag_name=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.tag_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build release APK
        run: ./gradlew clean assembleRelease

      - name: Sign APK (if secrets configured)
        id: sign_apk
        if: ${{ format('{0}', secrets.SIGNING_KEY) != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk-ready/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare release files (APK)
        run: |
          if [ -n "${{ steps.sign_apk.outputs.signedReleaseFile }}" ]; then
            echo "release_file=${{ steps.sign_apk.outputs.signedReleaseFile }}" >> $GITHUB_ENV
          else
            UNSIGNED=$(find app/build/outputs/apk-ready/release -name "*.apk" | head -1)
            cp "$UNSIGNED" app/build/outputs/apk-ready/release/DeskflowAndroid-${{ env.tag_name }}-unsigned.apk
            echo "release_file=$(readlink -f app/build/outputs/apk-ready/release/DeskflowAndroid-${{ env.tag_name }}-unsigned.apk)" >> $GITHUB_ENV
          fi

      - name: Create/Update GitHub Release (APK)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.release_file }}
          tag_name: ${{ env.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
